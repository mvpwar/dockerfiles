<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>kzb PNG 资源小助手</title>
<style>
:root{
  --bg:#f4f6f9;--panel:#fff;--line:#e2e6ec;--txt:#1f2430;--dim:#6c7686;
  --acc:#2563eb;--green:#15a34a;--amber:#d97706;--red:#dc2626;--blue:#0284c7;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14px/1.55 "Microsoft YaHei","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--txt)}
header{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);padding:14px 18px 12px}
h1{margin:0 0 10px;font-size:17px;font-weight:700;letter-spacing:.3px;display:flex;align-items:baseline;flex-wrap:wrap}
h1 small{font-weight:400;color:var(--dim);font-size:12px;margin-left:10px}
h1 .byline{margin-left:12px;align-self:center;font-size:12px;font-weight:600;color:var(--acc);background:#eef4ff;
  border:1px solid #dbe6ff;border-radius:20px;padding:3px 13px;letter-spacing:.2px;white-space:nowrap}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.slot{border:2px dashed #c9d2e0;border-radius:10px;padding:10px 12px;background:#fbfcfe;cursor:pointer;transition:.15s;min-height:62px}
.slot:hover{border-color:var(--acc);background:#f2f6ff}
.slot.has{border-style:solid;border-color:var(--acc);background:#f5f8ff}
.slot .t{font-weight:600;font-size:13px}
.slot .n{color:var(--dim);font-size:12px;margin-top:4px;word-break:break-all}
.slot .st{font-size:12px;margin-top:4px;color:var(--acc)}
/* ★ 一个 app.sv 里可能有多个 kzb（bic_byd_stha.kzb / custom-theme/template.kzb / 3dscreen.kzb…）
   ⇒ 槽里加一个选择器，切哪个看哪个（点它别触发「选文件」） */
.slot .ksel{margin-top:7px;font-size:12px;display:none;border-top:1px dashed #d7dfeb;padding-top:7px;cursor:default}
.slot .ksel.on{display:block}
.slot .ksel .kh{color:var(--dim);margin-bottom:4px;line-height:1.5}
.slot .ksel select{max-width:100%;font:inherit;font-size:12px;padding:3px 6px;
  border:1px solid #c9d2e0;border-radius:7px;background:#fff;color:#1f2937;cursor:pointer}
.slot .ksel select:hover{border-color:var(--acc)}
.slot .ksel .knote{margin-top:4px;color:#b45309;line-height:1.5}
input[type=file]{display:none}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px;font-size:13px}
.chip{padding:3px 10px;border-radius:20px;background:#eef1f6;color:#3c4657;font-size:12px;white-space:nowrap}
.chip.g{background:#e6f7ec;color:#15803d}
.chip.a{background:#fdf1e3;color:#b45309}
.chip.r{background:#fdeaea;color:#b91c1c}
.chip.b{background:#e6f2fd;color:#0369a1}
.chip.k{background:#eef1f6;color:#3c4657}
select,input[type=text]{padding:5px 8px;border:1px solid var(--line);border-radius:7px;background:#fff;font:13px inherit;color:var(--txt)}
button{padding:6px 13px;border:1px solid var(--line);border-radius:7px;background:#fff;cursor:pointer;font:13px inherit;color:var(--txt)}
button:hover{border-color:var(--acc);color:var(--acc)}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
button.pri:hover{background:#1d4ed8;color:#fff}
main{padding:14px 18px 60px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;transition:.12s}
.card:hover{box-shadow:0 3px 14px rgba(30,50,90,.10);transform:translateY(-1px)}
.card .thumbs{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-bottom:1px solid var(--line)}
.card .th{position:relative;height:122px;display:flex;align-items:center;justify-content:center;overflow:hidden;
  background:repeating-conic-gradient(#eef1f5 0 25%,#fff 0 50%) 0 0/14px 14px}
.card .th img{max-width:100%;max-height:118px;image-rendering:auto}
.card .th .tag{position:absolute;left:4px;top:4px;background:rgba(37,99,235,.9);color:#fff;
  font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px;line-height:14px;letter-spacing:.4px}
.card .th.tb .tag{background:rgba(2,132,199,.9)}
.card .th.none{color:#b3bac6;font-size:11.5px;text-align:center;padding:0 6px;line-height:1.35}
.card .hd{display:flex;align-items:center;gap:8px;padding:7px 10px;border-bottom:1px solid var(--line);background:#fbfcfe}
.card .hd input[type=checkbox]{width:15px;height:15px;margin:0;flex:none;cursor:pointer;accent-color:#2563eb}
.card .hd .fn{flex:1;font-weight:600;font-size:12.5px;word-break:break-all;line-height:1.35}
.card.sel{border-color:var(--acc);box-shadow:0 0 0 2px rgba(37,99,235,.18)}
.card .meta{padding:8px 10px 9px}
.card .fname{font-weight:600;font-size:12.5px;word-break:break-all;line-height:1.35}
.card .cat{color:var(--dim);font-size:11px;margin-top:2px;word-break:break-all}
.card .row{display:flex;justify-content:space-between;font-size:11.5px;margin-top:4px;color:#48505e}
.card .row .lbl{color:var(--dim)}
.dcl{margin-left:4px;color:#6b7280;font-size:10.5px;white-space:nowrap}
.dcl.warn{color:#c2410c;font-weight:700}
.dcl.none{color:#9aa2ad}
.card .badge{display:inline-block;padding:1px 7px;border-radius:5px;font-size:11px;font-weight:600;white-space:nowrap;flex:none}
.b-same{background:#e6f7ec;color:#15803d}
.b-diff{background:#fdf1e3;color:#b45309}
.b-onlyA{background:#fdeaea;color:#b91c1c}
.b-onlyB{background:#e6f2fd;color:#0369a1}
.b-solo{background:#eef1f6;color:#3c4657}
/* ---- 卡片上的「替换方向」按钮 ---- */
.card .patch{display:flex;gap:6px;padding:7px 10px;border-bottom:1px solid var(--line);background:#fafbfd}
.card .patch button{flex:1;padding:5px 4px;font-size:11.5px;border-radius:6px;line-height:1.25;
  display:flex;align-items:center;justify-content:center;gap:3px;min-width:0}
.card .patch button .arw{font-weight:700;font-size:13px}
.card .patch button.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.card .patch button.on:hover{background:#1d4ed8;color:#fff}
.card .patch button.cu{border-color:#c4b5fd}
.card .patch button.cu.on{background:#7c3aed;border-color:#7c3aed}
/* ---- 顶部「替换 / 出包」操作条 ---- */
.ops{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px;padding:9px 12px;
  background:#eef4ff;border:1px solid #cddffb;border-radius:9px;font-size:13px}
.ops .oc{font-weight:600;color:#134a9c}
.ops .oc b{color:#0f3d85;font-size:14px}
.ops .sp2{flex:1 1 18px}
.ops button.go{background:#15a34a;border-color:#15a34a;color:#fff;font-weight:700;padding:7px 18px;font-size:13.5px}
.ops button.go:hover{background:#118a3e;color:#fff}
.ops button.go:disabled{background:#b9c7bd;border-color:#b9c7bd;color:#f2f5f3;cursor:not-allowed}
.ops .tip{color:#5b6b83;font-size:12px}
/* ---- 大图弹窗里的「换成本地图」---- */
.pane .pickbtn{display:block;width:100%;margin-top:7px;padding:6px 8px;font-size:12px}
.pane .cus{color:#7c3aed;font-weight:600}
.card.s-diff{border-color:#f3c98b}
.card.s-onlyA{border-color:#f0b0b0}
.card.s-onlyB{border-color:#a9cdf0}
dialog{border:none;border-radius:12px;padding:0;max-width:96vw;max-height:94vh;box-shadow:0 20px 60px rgba(20,30,60,.3)}
dialog::backdrop{background:rgba(20,28,48,.55)}
.dlg{padding:16px 18px 18px;min-width:min(900px,92vw)}
.dlg h3{margin:0 0 4px;font-size:15px;word-break:break-all}
.dlg .sub{color:var(--dim);font-size:12px;margin-bottom:12px;word-break:break-all}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cmp.one{grid-template-columns:1fr}
.pane{border:1px solid var(--line);border-radius:9px;padding:9px;background:#fbfcfe}
.pane .h{font-size:12px;font-weight:600;color:#3c4657;margin-bottom:6px}
.pane .box{height:300px;display:flex;align-items:center;justify-content:center;
  background:repeating-conic-gradient(#eef1f5 0 25%,#fff 0 50%) 0 0/16px 16px;border-radius:6px;overflow:auto}
.pane .box img{max-width:100%;max-height:290px}
.pane .i{font-size:11.5px;color:#48505e;margin-top:6px;font-family:Consolas,monospace}
.close{position:absolute;right:14px;top:12px}
.note{margin-top:12px;font-size:12.5px;color:var(--dim);background:#f1f5fb;border:1px solid #dae4f3;border-radius:8px;padding:9px 12px}
button:disabled{opacity:.45;cursor:not-allowed}
button:disabled:hover{border-color:var(--line);color:var(--txt)}
.bar .sp{flex:1 1 24px}
.pick{margin:14px 0 9px;font-weight:600;font-size:13.5px}
.pbtns{display:flex;flex-wrap:wrap;gap:9px}
.pbtns button{padding:9px 16px;font-size:13.5px}
.pbtns button b{color:var(--acc);margin-left:2px}
.pbtns button.pri b{color:#fff}
.kp{display:flex;align-items:center;gap:7px;font-size:13px;color:#3c4657;margin-top:14px}
.kp input{width:15px;height:15px;accent-color:#2563eb}
.kp code, .note code{background:#eef1f6;padding:1px 5px;border-radius:4px;font-size:12px}
.pfoot{text-align:right;margin-top:16px}
/* 🔤 字体面板 */
.fbtn{padding:4px 9px;font-size:12px;margin:2px 3px 2px 0;white-space:nowrap}
.fbtn.on{background:#dcfce7;border-color:#86efac;color:#15803d;font-weight:600}
.fbtn:disabled{opacity:.45;cursor:not-allowed}
#fprev span[data-smp]{line-height:1.45}

#fontDlg .dlg h3{padding-right:90px}          /* 给右上角关闭按钮留位 */

#declDlg .dlg h3{padding-right:90px}
.dwrap{margin-top:10px;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.dtbl{width:100%;border-collapse:collapse;font-size:13px}
.dtbl th{text-align:left;font-size:11.5px;color:var(--dim);font-weight:600;padding:7px 9px;background:#f7f9fc;
  border-bottom:1px solid var(--line);white-space:nowrap}
.dtbl td{padding:8px 9px;border-bottom:1px solid #eff3f9;vertical-align:top}
.dtbl tbody tr:last-child td{border-bottom:none}
.dtbl tr.dirty td{background:#f2f8ff}
.dtbl .sz{font:13px Consolas,monospace;font-weight:600;color:#1f2937;white-space:nowrap}
.dtbl .cnt{font:12px Consolas,monospace;color:#5b6b83;white-space:nowrap}
.dtbl input[type=number]{width:64px;padding:3px 6px;font-size:13px;border:1px solid var(--line);border-radius:6px;
  font-family:Consolas,monospace}
.dtbl button{padding:4px 10px;font-size:12px;white-space:nowrap}
.dtbl .names{font:11px/1.6 Consolas,monospace;color:#59677d;word-break:break-all;max-width:380px}
.dchip{display:inline-block;background:#eef1f6;border-radius:5px;padding:1px 6px;margin:1px 4px 1px 0;white-space:nowrap}
.dsum{margin-top:12px;font-size:13px;color:#3c4657}
.dsum b{color:var(--acc)}
.dmsg{margin-top:9px;font-size:13px}
.dmsg.on{padding:8px 12px;border-radius:8px;background:#e9f8ee;border:1px solid #b3e0c4;color:#116634;font-weight:600}
.dmsg.warn{padding:8px 12px;border-radius:8px;background:#fdf7e6;border:1px solid #eeda9f;color:#8a5a00;font-weight:600}
.hint{color:var(--dim);font-size:13px;padding:26px 4px;text-align:center}
#alert{display:none;margin-top:12px;padding:11px 15px;border-radius:9px;font-size:13.5px;font-weight:600;line-height:1.5}
#alert.on{display:block}
#alert.err{background:#fdeaea;border:1px solid #f0b3b3;color:#a11414}
#alert.warn{background:#fdf7e6;border:1px solid #eeda9f;color:#8a5a00}
#alert.info{background:#e9f2ff;border:1px solid #b7d2f6;color:#134a9c}
#alert.ok{background:#e9f8ee;border:1px solid #b3e0c4;color:#116634}
#logbox{display:none;margin-top:10px;font:11.5px/1.6 Consolas,monospace;color:#48505e;background:#f8fafc;
  border:1px solid var(--line);border-radius:9px;padding:8px 12px;max-height:132px;overflow:auto;white-space:pre-wrap}
#logbox.on{display:block}
video{display:none}
/* ===== 预览底色 / 合成方式 ===== */
.seg.on{background:var(--acc);border-color:var(--acc);color:#fff}
.seg.on:hover{background:#1d4ed8;border-color:#1d4ed8;color:#fff}
.lblx{font-size:12.5px;color:var(--dim);margin:0 1px 0 3px}
.ckx{display:flex;align-items:center;gap:5px;font-size:12.5px;color:#3c4657;cursor:pointer;user-select:none;white-space:nowrap}
.ckx input{width:15px;height:15px;margin:0;accent-color:#2563eb;cursor:pointer}
body.bgw .card .th{background:#ffffff}
body.bgd .card .th{background:#141414}

body.bgd .pane .box{background:#141414}

.card .th canvas{max-width:100%;max-height:118px}
.pane .box canvas{max-width:100%;max-height:290px}
</style>

<body>
<header>
  <h1>kzb PNG 资源小助手 <small>选两个 app.sv / .kzb / 刷机包 zip，自动比对里面的 PNG 资源</small><span class="byline">by 福建宋plus车友群 Winamp</span></h1>
  <div class="slots">
    <div class="slot" id="slotA"><div class="t">① 文件 A</div><div class="n">拖进来，或点这里选择 app.sv / .kzb / .zip</div><div class="st"></div><div class="ksel"></div></div>
    <div class="slot" id="slotB"><div class="t">② 文件 B</div><div class="n">拖进来，或点这里选择 app.sv / .kzb / .zip</div><div class="st"></div><div class="ksel"></div></div>
  </div>
  <div class="ops" id="ops"></div>
  <div class="bar" id="bar"></div>
  <div id="alert"></div>
  <div id="logbox"></div>
</header>
<main>
  <div id="grid"><div class="hint">两个文件都选好后，这里会列出 kzb 里的全部 PNG（按分类、可筛选、可只看差异）。</div></div>
</main>
<input type="file" id="fileA" accept=".sv,.kzb,.zip,.bin,application/octet-stream">
<input type="file" id="fileB" accept=".sv,.kzb,.zip,.bin,application/octet-stream">
<input type="file" id="filePng" accept="image/png,.png">
<input type="file" id="fileTtf" accept=".ttf,.otf,.ttc,.woff,.woff2,font/*,application/octet-stream">
<dialog id="dlg"><div class="dlg" id="dlgBody"></div><button class="close" onclick="document.getElementById('dlg').close()">关闭 ✕</button></dialog>
<dialog id="pickDlg"><div class="dlg" id="pickBody"></div></dialog>
<dialog id="buildDlg"><div class="dlg" id="buildBody"></div></dialog>
<dialog id="warnDlg"><div class="dlg" id="warnBody"></div></dialog>
<dialog id="fontDlg"><div class="dlg" id="fontBody"></div><button class="close" onclick="closeFontDlg()">关闭 ✕</button></dialog>
<dialog id="declDlg"><div class="dlg" id="declBody"></div><button class="close" onclick="closeDeclDlg()">关闭 ✕</button></dialog>

<script>
"use strict";
/* ===================== 工具函数 ===================== */
const dec = new TextDecoder('latin1');
/* tar 里可替换的字体条目（app.sv 的 ./base/app/rc_hmi/Resource_Font/*.ttf） */
const FONT_RE = /\.(ttf|otf|ttc|woff2?)$/i;
const FONT_MAGIC = {
  '(TTF 轮廓)':   [0x00, 0x01, 0x00, 0x00],
  'OTTO (CFF)':   [0x4f, 0x54, 0x54, 0x4f],
  'true (Apple)': [0x74, 0x72, 0x75, 0x65],
  'ttcf (集合)':  [0x74, 0x74, 0x63, 0x66],
  'wOFF':         [0x77, 0x4f, 0x46, 0x46],
  'wOF2':         [0x77, 0x4f, 0x46, 0x32]
};
function fontKind(b){                          // 返回字体类型名；识别不了返回 null
  if (!b || b.length < 4) return null;
  for (const k in FONT_MAGIC){
    const m = FONT_MAGIC[k];
    if (b[0] === m[0] && b[1] === m[1] && b[2] === m[2] && b[3] === m[3]) return k;
  }
  return null;
}
function latin1(u8){
  const parts = [], CH = 0x8000;
  for (let i = 0; i < u8.length; i += CH) parts.push(String.fromCharCode.apply(null, u8.subarray(i, i + CH)));
  return parts.join('');
}
/* ---- 名字解码 ----
   kzb 里 latin1 扫描的目的是拿到「字节偏移」，但路径名本身是 UTF-8
   （实测有 197 个中文名，如 Images/Indicator/ABS故障.png）。
   所以定位用 latin1、取名字时必须把字节区间按 UTF-8 重新解一次；
   万一遇到 GBK 老包也能兜住。 */
const TD_UTF8  = new TextDecoder('utf-8');
const TD_UTF8F = new TextDecoder('utf-8', { fatal: true });
let TD_GBK = null; try { TD_GBK = new TextDecoder('gbk'); } catch (e){}
function decodeName(bytes){
  let ascii = true;
  for (let i = 0; i < bytes.length; i++) if (bytes[i] >= 0x80) { ascii = false; break; }
  if (ascii) return String.fromCharCode.apply(null, bytes);
  try { return TD_UTF8F.decode(bytes); } catch (e){}
  if (TD_GBK){ try { return TD_GBK.decode(bytes); } catch (e){} }
  return TD_UTF8.decode(bytes);
}
function sliceBytes(s, a, b){                  // latin1 串的 [a,b) → Uint8Array
  const u = new Uint8Array(b - a);
  for (let k = a; k < b; k++) u[k - a] = s.charCodeAt(k) & 0xff;
  return u;
}
async function inflateRaw(u8){
  const ds = new DecompressionStream('deflate-raw');
  const st = new Blob([u8]).stream().pipeThrough(ds);
  return new Uint8Array(await new Response(st).arrayBuffer());
}
async function gunzip(u8){
  const ds = new DecompressionStream('gzip');
  const st = new Blob([u8]).stream().pipeThrough(ds);
  return new Uint8Array(await new Response(st).arrayBuffer());
}
const u32 = (u8, o) => (u8[o] | (u8[o+1] << 8) | (u8[o+2] << 16) | (u8[o+3] << 24)) >>> 0;
const u32be = (u8, o) => ((u8[o] << 24) | (u8[o+1] << 16) | (u8[o+2] << 8) | u8[o+3]) >>> 0;
const u16 = (u8, o) => (u8[o] | (u8[o+1] << 8));
/* CRC32（zip / gzip 尾部用）；纯函数，放核心区方便测试切分 */
let CRC_T = null;
function crc32(u8){
  if (!CRC_T){
    CRC_T = new Uint32Array(256);
    for (let n = 0; n < 256; n++){ let c = n; for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1); CRC_T[n] = c >>> 0; }
  }
  let c = 0xFFFFFFFF;
  for (let i = 0; i < u8.length; i++) c = CRC_T[(c ^ u8[i]) & 0xFF] ^ (c >>> 8);
  return ((c ^ 0xFFFFFFFF) >>> 0);
}
/* 提取某个条目的 PNG 字节：需要 {item, bytes} 形式 */
const itemBytes = f => f.bytes.subarray(f.item.pngOff, f.item.pngOff + f.item.size);
const fmt = n => n.toLocaleString('en-US');

/* ===================== 容器解析 ===================== */
// zip -> 找里面的 app.sv / .kzb
async function fromZip(buf, log){
  let eocd = -1;
  const tail = Math.max(0, buf.length - 66000);
  for (let i = buf.length - 22; i >= tail; i--) if (u32(buf, i) === 0x06054b50) { eocd = i; break; }
  if (eocd < 0) throw new Error('不是有效的 zip 文件');
  const n = u16(buf, eocd + 10);
  let p = u32(buf, eocd + 16);
  for (let k = 0; k < n; k++){
    if (u32(buf, p) !== 0x02014b50) break;
    const method = u16(buf, p + 10);
    const csize = u32(buf, p + 20);
    const nlen = u16(buf, p + 28), elen = u16(buf, p + 30), clen = u16(buf, p + 32);
    const lho = u32(buf, p + 42);
    const name = decodeName(buf.subarray(p + 46, p + 46 + nlen));
    if (/\.(sv|kzb)$/i.test(name)){
      const lnl = u16(buf, lho + 26), lel = u16(buf, lho + 28);
      const off = lho + 30 + lnl + lel;
      const data = buf.subarray(off, off + csize);
      log('zip 内找到 ' + name + (method === 8 ? '（deflate 解压中）' : ''));
      return { name, data: method === 8 ? await inflateRaw(data) : data };

    if (/\.kzb$/i.test(name)){

      const cand = { name, short: name.split('/').pop(), size,

      用户以为「图丢了」；2026-10-13：改成可切换，不再只是提示。） */
  const pickK = chosen || fallback;
  if (pickK){
    pickK.fonts = fonts;
    pickK.kzbs = kzbs;
    pickK.mainIdx = kzbs.indexOf(chosen);
    log('tar 里找到 ' + pickK.name + '（' + fmt(pickK.size) + ' B）' +
        (kzbs.length > 1 ? '；包里共 ' + kzbs.length + ' 个 kzb（可在卡片里切换）' : ''));

  if (test(0x1e0b5)) return 0x1e0b5;            // 已知常见位置，先试
  const lim = Math.min(len - 24 * 6, 0x400000);
  for (let base = 0; base < lim; base++){
    if (rd(base) === 0 && rd(base + 24) === 1 && rd(base + 48) === 2 && test(base)) return base;
  }

/* MD5（浏览器无内置，自实现；返回 32 位小写 hex） */
function md5hex(bytes){
  const K = new Uint32Array(64);
  for (let i = 0; i < 64; i++) K[i] = Math.floor(Math.abs(Math.sin(i + 1)) * 4294967296) | 0;
  const S = [7,12,17,22,7,12,17,22,7,12,17,22,7,12,17,22,
             5,9,14,20,5,9,14,20,5,9,14,20,5,9,14,20,
             4,11,16,23,4,11,16,23,4,11,16,23,4,11,16,23,
             6,10,15,21,6,10,15,21,6,10,15,21,6,10,15,21];
  const len = bytes.length;
  const padLen = Math.ceil((len + 9) / 64) * 64;          // 必须这样算（+1 个 0x80 + 8 字节长度）
  const buf = new Uint8Array(padLen);
  buf.set(bytes);
  buf[len] = 0x80;
  const dv = new DataView(buf.buffer);
  const bits = len * 8;
  dv.setUint32(padLen - 8, bits >>> 0, true);
  dv.setUint32(padLen - 4, Math.floor(bits / 4294967296) >>> 0, true);
  let a0 = 0x67452301, b0 = 0xefcdab89, c0 = 0x98badcfe, d0 = 0x10325476;
  const M = new Uint32Array(16);
  for (let off = 0; off < padLen; off += 64){
    for (let i = 0; i < 16; i++) M[i] = dv.getUint32(off + i * 4, true);
    let A = a0, B = b0, C = c0, D = d0;
    for (let i = 0; i < 64; i++){
      let F, g;
      if (i < 16){ F = (B & C) | (~B & D); g = i; }
      else if (i < 32){ F = (D & B) | (~D & C); g = (5 * i + 1) & 15; }
      else if (i < 48){ F = B ^ C ^ D; g = (3 * i + 5) & 15; }
      else { F = C ^ (B | ~D); g = (7 * i) & 15; }
      F = (F + A + K[i] + M[g]) | 0;
      A = D; D = C; C = B;
      B = (B + ((F << S[i]) | (F >>> (32 - S[i])))) | 0;
    }
    a0 = (a0 + A) | 0; b0 = (b0 + B) | 0; c0 = (c0 + C) | 0; d0 = (d0 + D) | 0;
  }
  const out = new Uint8Array(16), odv = new DataView(out.buffer);
  odv.setUint32(0, a0 >>> 0, true); odv.setUint32(4, b0 >>> 0, true);
  odv.setUint32(8, c0 >>> 0, true); odv.setUint32(12, d0 >>> 0, true);
  let h = '';
  for (let i = 0; i < 16; i++) h += out[i].toString(16).padStart(2, '0');
  return h;
}
/* 组装 .sv：raw deflate + 复刻源包 gzip 头 + CRC32/ISIZE + 512B 脚注(MD5) */
async function buildSvBytes(tarBytes, meta){
  const cs = new CompressionStream('deflate-raw');
  const w = cs.writable.getWriter();
  const p = w.write(tarBytes).then(() => w.close());
  const defl = new Uint8Array(await new Response(cs.readable).arrayBuffer());
  await p;
  const fn = meta.fname ? new TextEncoder().encode(meta.fname) : null;
  const hdrLen = 10 + (fn ? fn.length + 1 : 0);
  const hdr = new Uint8Array(hdrLen);
  hdr[0] = 0x1f; hdr[1] = 0x8b; hdr[2] = 0x08; hdr[3] = meta.flg;
  new DataView(hdr.buffer).setUint32(4, meta.mtime >>> 0, true);
  hdr[8] = meta.xfl; hdr[9] = meta.os;
  if (fn) hdr.set(fn, 10);
  const tail = new Uint8Array(8), tdv = new DataView(tail.buffer);
  tdv.setUint32(0, crc32(tarBytes) >>> 0, true);
  tdv.setUint32(4, tarBytes.length >>> 0, true);
  const gz = new Uint8Array(hdrLen + defl.length + 8);
  gz.set(hdr, 0); gz.set(defl, hdrLen); gz.set(tail, hdrLen + defl.length);
  const foot = new Uint8Array(512);
  foot.set(meta.footFront, 0);
  const h = md5hex(gz);
  for (let i = 0; i < 32; i++) foot[0x120 + i] = h.charCodeAt(i);
  new DataView(foot.buffer).setUint32(0x140, tarBytes.length >>> 0, true);
  const sv = new Uint8Array(gz.length + 512);
  sv.set(gz); sv.set(foot, gz.length);
  return sv;
}
/* kzb 区间「变长替换」+ 重算资源表（targets: Map(idx → Uint8Array)） */
function rebuildKzb(s, kzb, targets){
  const TBL = findTable(s, kzb.length);
  if (TBL < 0) throw new Error('没找到资源表');
  const N = kzbCount(kzb, TBL, s);
  if (N < 0) throw new Error('资源数读不出（表 @0x' + TBL.toString(16) + '）');
  const offs = new Int32Array(N), lens = new Uint32Array(N);
  for (let k = 0; k < N; k++){ offs[k] = u32(kzb, TBL + k * 24 + 8); lens[k] = u32(kzb, TBL + k * 24 + 12); }
  /* ★ 乱序检测：有些包的资源表 off 并不按 idx 递增（例：「熊猫定制版」有 3 条
     idx 418/3132/3134 逻辑上排前面、物理数据却被作者放在文件尾）。
     旧算法按「idx 区间」重建 + 只把区间之后的条目整体平移 Δ，
     那些乱序条目的 off 不会被前移 ⇒ 越界 ⇒ 数据丢失 ⇒ 刷进去黑屏。
     ⇒ 现统一改为「按物理 off 顺序重建整个数据区」，递增包与乱序包都正确。 */
  const badIdx = [];
  for (let k = 1; k < N; k++) if (offs[k] < offs[k - 1]) badIdx.push(k);
  const phys = Array.from({ length: N }, (_, i) => i).sort((a, b) => offs[a] - offs[b]);
  const padOf = k => Math.ceil(lens[k] / 4) * 4;
  const dataStart = offs[phys[0]];
  const parts = [], newOff = new Int32Array(N), newLen = new Uint32Array(N);
  let cur = dataStart;
  for (let t = 0; t < phys.length; t++){
    const k = phys[t];
    const o = offs[k];
    /* 「物理段」= [本条 off, 下一条 off)（最后一条到文件尾）。
       ★ 不能假设条目按 4 字节对齐填充 —— 实测有包（熊猫版末条 idx 3134）
         len 不是 4 的倍数且文件直接结束；用 pad 取数会多吃字节、把总长搞坏。
         整段取可保证「零替换 ⇒ 逐字节还原」，与是否有对齐无关。 */
    const ge = (t + 1 < phys.length) ? offs[phys[t + 1]] : kzb.length;
    newOff[k] = cur;
    if (targets.has(k)){
      const pl = targets.get(k);
      const entLen = 20 + pl.length, pad = (4 - (entLen % 4)) % 4;
      const ent = new Uint8Array(entLen + pad);
      ent.set(kzb.subarray(o, o + 16), 0);
      new DataView(ent.buffer).setUint32(16, pl.length, true);
      ent.set(pl, 20);
      newLen[k] = 20 + pl.length;
      parts.push(ent); cur += ent.length;
      /* 原条目本体之后、下一物理条目之前的字节（对齐填充 / 孤儿数据）原样保留 */
      const body = o + Math.min(padOf(k), ge - o);
      if (ge > body){ const g = kzb.subarray(body, ge); parts.push(g); cur += g.length; }
    } else {
      const raw = kzb.subarray(o, ge);          // 条目本体 + 尾随字节，整段原样
      newLen[k] = lens[k];
      parts.push(raw); cur += raw.length;
    }
  }
  const out = new Uint8Array(cur);
  let p = 0;
  out.set(kzb.subarray(0, dataStart), p); p += dataStart;
  for (const q of parts){ out.set(q, p); p += q.length; }
  const to = new DataView(out.buffer);
  for (let k = 0; k < N; k++){
    to.setUint32(TBL + k * 24 + 8, newOff[k], true);
    to.setUint32(TBL + k * 24 + 12, newLen[k], true);
    to.setUint32(TBL + k * 24 + 20, newLen[k], true);
  }
  return { kzb: out, delta: out.length - kzb.length, TBL, N, newOff, newLen, badIdx };
}

function tarReplaceKzb(sv, newKzb){
  const { tar, pos, size } = sv;
  const oldPad = Math.ceil(size / 512) * 512;
  const newPad = Math.ceil(newKzb.length / 512) * 512;
  const hdr = tar.subarray(pos, pos + 512).slice();
  const sz = newKzb.length.toString(8).padStart(11, '0') + '\0';
  for (let i = 0; i < 12; i++) hdr[124 + i] = sz.charCodeAt(i);
  for (let i = 148; i < 156; i++) hdr[i] = 0x20;
  let sum = 0; for (let i = 0; i < 512; i++) sum += hdr[i];
  const cs = sum.toString(8).padStart(6, '0') + '\0 ';
  for (let i = 0; i < 8; i++) hdr[148 + i] = cs.charCodeAt(i);
  const tailStart = pos + 512 + oldPad;
  const out = new Uint8Array(tar.length - oldPad + newPad);
  out.set(tar.subarray(0, pos), 0);
  out.set(hdr, pos);
  out.set(newKzb, pos + 512);
  out.set(tar.subarray(tailStart), pos + 512 + newPad);

/* ★ 通用 tar 重建：可同时替换多个条目（kzb + 字体 …）

function tarRebuild(tar, patches){

    let allZero = true;

    if (allZero) break;
    let nEnd = 0; while (nEnd < 100 && tar[pos + nEnd]) nEnd++;
    const name = decodeName(tar.subarray(pos, pos + nEnd));
    const sizeStr = dec.decode(tar.subarray(pos + 124, pos + 136)).replace(/[\0 ]/g, '');
    const size = parseInt(sizeStr, 8) || 0;
    const pad = Math.ceil(size / 512) * 512;
    if (patches.has(pos)){
      const nb = patches.get(pos);
      const nh = tar.subarray(pos, pos + 512).slice();
      const sz = nb.length.toString(8).padStart(11, '0') + '\0';
      for (let i = 0; i < 12; i++) nh[124 + i] = sz.charCodeAt(i);
      for (let i = 148; i < 156; i++) nh[i] = 0x20;
      let sum = 0; for (let i = 0; i < 512; i++) sum += nh[i];
      const cs = sum.toString(8).padStart(6, '0') + '\0 ';
      for (let i = 0; i < 8; i++) nh[148 + i] = cs.charCodeAt(i);
      chunks.push(nh);
      const npad = Math.ceil(nb.length / 512) * 512;
      const blk = new Uint8Array(npad);
      blk.set(nb);
      chunks.push(blk);
      info.push({ name, pos, oldSize: size, newSize: nb.length });
    } else {
      chunks.push(tar.subarray(pos, pos + 512 + pad));

  const tail = tar.subarray(pos);

  for (const c of chunks) total += c.length;
  const out = new Uint8Array(total);
  let o = 0;
  for (const c of chunks){ out.set(c, o); o += c.length; }
  out.set(tail, o);

function tarEntryBytes(tar, wantName){

    let allZero = true;
    for (let i = 0; i < 512; i++) if (tar[pos + i]) { allZero = false; break; }
    if (allZero) break;
    let nEnd = 0; while (nEnd < 100 && tar[pos + nEnd]) nEnd++;

  for (const [key, p] of PATCH){
    const ai = amap.get(key) || null, bi = bmap.get(key) || null;

    if (p.custom){ bytes = p.custom.bytes; srcName = '本地图 ' + p.custom.name; }

      bytes = itemBytes({ item: bi, bytes: S.B.bytes }); srcName = 'B 侧同名图';
    } else {

/* ---- 下载 & 命名工具 ---- */
function downloadBytes(bytes, filename){
  const url = URL.createObjectURL(new Blob([bytes], { type: 'application/octet-stream' }));
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 20000);
}
function kzbNameOf(base){
  /* ★ 多 kzb 支持后，导出名要跟【当前选中的那个 kzb】走，不再固定 bic_byd_stha.kzb */
  if (base && base.kzbShort && /\.kzb$/i.test(base.kzbShort)) return base.kzbShort;
  const f = String((base && base.file) || '');
  const i = f.toLowerCase().lastIndexOf('.kzb');
  if (i > 0){
    const s = f.slice(0, i).split(/[\s>/\\]/).filter(Boolean).pop();
    if (s) return s + '.kzb';
  }
  return 'bic_byd_stha.kzb';
}
/* ---- 真正出包：kind = 'sv'（完整 app.sv）| 'kzb'（只资源包本体） ----
   ⚠️ 第二个参数别叫 fmt —— 会遮蔽全局的 fmt()（千分位格式化函数），
      成功提示里一调用就报「fmt is not a function」（2026-10-11 踩到）。 */
async function doBuild(target, kind){
  kind = (kind === 'kzb') ? 'kzb' : 'sv';
  const d = document.getElementById('buildDlg');
  if (d && d.close) d.close();
  const plan = BUILD_PLAN;
  if (!plan) return;
  const list = (target === 'A') ? plan.toA : plan.toB;
  const base = S[target];
  const fAll = (typeof FPATCH !== 'undefined' && FPATCH && FPATCH[target]) ? FPATCH[target] : new Map();
  const nFont = (kind === 'sv') ? fAll.size : 0;             // 字体在 tar 里，.kzb 模式不涉及
  const dmap = (typeof DPATCH !== 'undefined' && DPATCH && DPATCH[target]) ? DPATCH[target] : new Map();
  const nDecl = dmap.size;                                  // 声明改动（等长覆盖，两种产物都带上）
  try {
    if (!list.length && !nFont && !nDecl) throw new Error('没有要替换进 ' + target + ' 包的内容');
    if (!base) throw new Error(target + ' 槽没加载包');
    if (kind === 'sv' && !base.sv) throw new Error(target + ' 槽加载的是纯 .kzb，没有 app.sv 外壳 ⇒ 只能导出 .kzb（若想出 app.sv，请改选 app.sv 或整包 zip）');
    await new Promise(r => setTimeout(r, 60));
    /* ★ 声明改动：在重建【之前】写进底包副本（等长 4 字节覆盖 ⇒ 任何偏移都不变）；
       重建对未替换条目是「整段原样搬运」⇒ 改动必然跟着进新包。 */
    const srcBytes = nDecl ? declApplyBytes(base.bytes, dmap) : base.bytes;
    const targets = new Map(list.map(t => [t.idx, t.bytes]));
    const rb = rebuildKzb(latin1(base.bytes), srcBytes, targets);
    alertMsg('info', '出包中（替换后的 ' + target + ' → ' + (kind === 'sv' ? 'app.sv' : '.kzb') + '）：替换 ' + list.length + ' 张图' +
      (nFont ? ' + ' + nFont + ' 个字体' : '') +
      (nDecl ? ' + ' + nDecl + ' 处声明' : '') +
      (rb.badIdx.length ? '；⚠ 该包资源表含 ' + rb.badIdx.length + ' 个乱序条目，已按物理序重建' : '') +
      (kind === 'sv' ? ' → tar 手术 → 重新压缩（大包约 10~30 秒）…' : ' → 自检 → 写盘…'));

    const errs = [];
    /* ---- 自检 ⓪：声明改动确实按预期写进了底包副本 ---- */
    if (nDecl){
      const dv = new DataView(srcBytes.buffer, srcBytes.byteOffset, srcBytes.byteLength);
      let dok = 0;
      for (const ov of dmap.values()){
        const hs = (ov.h == null) || Math.abs(dv.getFloat32(ov.hOff, true) - ov.h) < 1e-4;
        const ws = (ov.w == null) || Math.abs(dv.getFloat32(ov.wOff, true) - ov.w) < 1e-4;
        if (hs && ws) dok++;
      }
      if (dok !== nDecl) errs.push('声明改动写入核对 ' + dok + '/' + nDecl);
    }
    /* ---- 自检 ①：资源表结构（乱序包换图最容易坏在这里，坏 = 刷进去黑屏） ---- */
    {
      const T2 = rb.TBL, N2 = kzbCount(rb.kzb, T2, null);   // 头没动过 ⇒ 头读法必成功
      const o2 = [], l2 = [];
      for (let k = 0; k < N2; k++){ o2.push(u32(rb.kzb, T2 + k * 24 + 8)); l2.push(u32(rb.kzb, T2 + k * 24 + 12)); }
      let ovf = 0;
      for (let k = 0; k < N2; k++) if (o2[k] + l2[k] > rb.kzb.length || o2[k] < 0) ovf++;
      if (ovf) errs.push('资源表越界 ' + ovf + ' 条');
      const ord = Array.from({ length: N2 }, (_, i) => i).sort((a, b) => o2[a] - o2[b]);
      let dis = 0;
      for (let t = 1; t < N2; t++) if (o2[ord[t]] < o2[ord[t - 1]] + l2[ord[t - 1]]) dis++;
      if (dis) errs.push('资源表物理序重叠 ' + dis + ' 处');
      /* 乱序条目必须原样保留 —— 旧版黑屏正是它们 off 没前移而越界丢数据。
         ★ 例外（2026-10-11 修）：本次【被替换的目标】本来就会变，必须排除，
           否则会误报「乱序条目 idx N 数据受损」——
           例：小熊猫 10-11 包里 ADSA_Small_bg_0/1 正好是 idx 572/573，
           其中 572 就是乱序条目。 */
      for (const k of rb.badIdx){
        if (targets.has(k)) continue;
        const no = rb.newOff[k], nl = rb.newLen[k];
        const oo = u32(base.bytes, T2 + k * 24 + 8);
        let same = (nl === u32(base.bytes, T2 + k * 24 + 12));
        for (let i = 0; same && i < nl; i++) if (rb.kzb[no + i] !== base.bytes[oo + i]) same = false;
        if (!same) errs.push('乱序条目 idx ' + k + ' 数据受损');
      }
    }
    /* ---- 自检 ②：重建后逐张核对被替换的图 ---- */
    let rebuilt = 0, okN = 0;
    try {
      const chk = await parseKzb(rb.kzb, () => {});
      rebuilt = chk.items.length;
      if (chk.items.length !== base.items.length) errs.push('重建后 PNG 数量变化（' + chk.items.length + '）');
      const byIdx = new Map();
      for (const it of chk.items) if (it.idx >= 0) byIdx.set(it.idx, it);
      for (const t of list){
        const ci = byIdx.get(t.idx);
        if (!ci){ errs.push('重建后丢失 idx ' + t.idx); continue; }
        if (ci.size !== t.bytes.length){ errs.push('长度不符 ' + t.base); continue; }
        const got = rb.kzb.subarray(ci.pngOff, ci.pngOff + ci.size);
        let same = true;
        for (let i = 0; i < t.bytes.length; i++) if (t.bytes[i] !== got[i]) { same = false; break; }
        if (same) okN++; else errs.push('内容不符 ' + t.base);
      }
    } catch (e){ errs.push('重解析失败：' + e.message); }

    /* ================= 模式一：只导出 .kzb ================= */
    if (kind === 'kzb'){
      if (errs.length) throw new Error('自检未通过 → 不出包：' + errs.slice(0, 3).join('；'));
      const kn = kzbNameOf(base);
      downloadBytes(rb.kzb, kn);
      alertMsg('ok', '✓ 已导出 ' + kn + '（替换后的 ' + target + '）：替换 ' + list.length + ' 张图' +
        (nDecl ? ' + ' + nDecl + ' 处声明' : '') + '，kzb ' +
        fmt(base.bytes.length) + ' → ' + fmt(rb.kzb.length) + ' B (Δ ' + (rb.delta >= 0 ? '+' : '') + fmt(Math.abs(rb.delta)) + ')' +
        '｜自检：重建后 ' + rebuilt + ' 张、逐字节核对 ' + okN + '/' + list.length +
        (nDecl ? '、声明 ' + nDecl + ' 处已写入' : '') +
        (rb.badIdx.length ? '｜乱序条目 ' + rb.badIdx.length + ' 个已按物理序重建 ✓' : '') +
        '　—— 直接拿这个 .kzb 用即可（注意：字体替换不写进 .kzb；声明改动已写进 .kzb）');
      return;
    }

    /* ================= 模式二：完整 app.sv ================= */
    /* tar 补丁 = 新 kzb + 该槽的字体条目 */
    const tarPatches = new Map();
    tarPatches.set(base.sv.pos, rb.kzb);
    for (const [pos, f] of fAll) tarPatches.set(pos, f.bytes);
    const ts = tarRebuild(base.sv.tar, tarPatches);
    const sv = await buildSvBytes(ts.tar, base.sv.meta);
    /* ---- 自检 ③：gzip 头 / 脚注 ---- */
    if (!(sv[0] === 0x1f && sv[1] === 0x8b)) errs.push('gzip 头不对');
    const gzLen = sv.length - 512, foot = sv.subarray(gzLen);
    let fh = ''; for (let i = 0; i < 32; i++) fh += String.fromCharCode(foot[0x120 + i]);
    if (fh !== md5hex(sv.subarray(0, gzLen))) errs.push('脚注 MD5 不符');
    if ((u32(foot, 0x140) >>> 0) !== ts.tar.length) errs.push('脚注解压大小不符');
    /* ---- 自检 ④：字体条目从新 tar 里取回、逐字节比对 ---- */
    let fOk = 0;
    for (const [, f] of fAll){
      const got = tarEntryBytes(ts.tar, f.name);
      if (!got || got.length !== f.bytes.length){ errs.push('字体条目大小不符 ' + f.short); continue; }
      let same = true;
      for (let i = 0; i < f.bytes.length; i++) if (got[i] !== f.bytes[i]) { same = false; break; }
      if (same) fOk++; else errs.push('字体内容不符 ' + f.short);
    }
    if (errs.length) throw new Error('自检未通过 → 不出包：' + errs.slice(0, 3).join('；'));
    downloadBytes(sv, 'app.sv');
    alertMsg('ok', '✓ 出包成功（【替换后的 ' + target + '】）：替换 ' + list.length + ' 张图' +
      (nFont ? ' + ' + nFont + ' 个字体' : '') +
      (nDecl ? ' + ' + nDecl + ' 处声明' : '') + '，app.sv ' + fmt(sv.length) +
      ' B（已开始下载）｜自检：重建后 ' + rebuilt + ' 张、逐字节核对 ' + okN + '/' + list.length +
      (nFont ? '、字体 ' + fOk + '/' + nFont : '') +
      '，kzb ' + fmt(base.bytes.length) + ' → ' + fmt(rb.kzb.length) + ' B (Δ ' +
      (rb.delta >= 0 ? '+' : '') + fmt(Math.abs(rb.delta)) + ')' +
      (rb.badIdx.length ? '｜乱序条目 ' + rb.badIdx.length + ' 个已按物理序重建 ✓' : '') +
      '　—— 拿它替换 ' + target + ' 槽那份底包的 app.sv 即可');
  } catch (e){
    alertMsg('err', '出包失败：' + ((e && e.message) || e));

/* ===================== 载入流程 ===================== */
const S = { A: null, B: null };
function setStatus(id, html){ const e = document.querySelector('#slot' + id + ' .st'); if (e) e.innerHTML = html; }
function setName(id, txt){ const e = document.querySelector('#slot' + id + ' .n'); if (e) e.textContent = txt; }

async function load(which, file){
  const slot = document.querySelector('#slot' + which);
  slot.classList.add('has');
  setName(which, file.name + '  (' + fmt(file.size) + ' B)');
  setStatus(which, '读取中…');
  alertMsg('info', '【' + which + '】正在读取 ' + file.name + '（' + fmt(file.size) + ' B）…');
  pushLog(which, '选取文件 ' + file.name + '（' + fmt(file.size) + ' B）');
  const logs = [];
  const log = m => {
    logs.push(m);
    setStatus(which, logs.slice(-4).join('<br>'));
    pushLog(which, m);
    alertMsg('info', '【' + which + '】' + m);
  };
  try {
    const buf = new Uint8Array(await file.arrayBuffer());
    log('已读入内存 ' + fmt(buf.length) + ' B');
    const res = await toKzb(buf, log);
    /* ★★ 一个 app.sv 里可能有多个 kzb（主资源包 + template.kzb / 3dscreen.kzb…）。
       统一成 kzbs 列表，当前看的是第 ki 个；切换时懒解析（12MB 的包不必一上来全解）。 */
    const kzbs = (res.kzbs && res.kzbs.length)
      ? res.kzbs
      : [{ name: res.name || file.name, short: String(res.name || file.name).split('/').pop(),
           size: res.data.length, data: res.data, sv: res.sv || null, parsed: null }];
    let ki = (res.kzbs && res.kzbs.length) ? Math.max(0, res.kzbs.indexOf(res)) : 0;
    if (res.mainIdx != null && res.mainIdx >= 0) ki = res.mainIdx;   // 默认选主资源包
    const z = kzbs[ki];
    if (!z.parsed) z.parsed = await parseKzb(z.data, log);
    const k = z.parsed;
    /* ★ 用 Object.assign 整体继承 parseKzb 的返回 —— 别再逐字段手抄了：
       已经漏过两次（declsAll、nameless），以后 parseKzb 加字段会自动带上。 */
    S[which] = Object.assign({}, k, {
      file: file.name + (res.name && res.name !== file.name ? ' \u2192 ' + res.name : ''),
      sv: z.sv || null, kzbs, ki, mainIdx: (res.mainIdx != null ? res.mainIdx : 0),
      kzbName: z.name, kzbShort: z.short
    });
    setStatus(which, '✓ ' + k.items.length + ' 张 PNG' +
      (kzbs.length > 1 ? '　<span style="color:#b45309">（共 ' + kzbs.length + ' 个 kzb，可切换）</span>' : ''));
    updateKsel(which);
    if (kzbs.length > 1)
      log('ℹ 这个 app.sv 里有 ' + kzbs.length + ' 个 kzb：' +
          kzbs.map(x => x.short + '（' + fmt(x.size) + ' B）').join('、') +
          ' —— 当前看的是 ' + z.short + '；想换另一个，用卡片里的下拉框切换。');
    pushLog(which, '完成：' + k.items.length + ' 张 PNG' + (kzbs.length > 1 ? '（' + z.short + '）' : ''));
    alertMsg('ok', '【' + which + '】解析完成，共 ' + k.items.length + ' 张 PNG。' +
      (kzbs.length > 1 ? '该包共 ' + kzbs.length + ' 个 kzb，可用卡片里的下拉框切换。' : '') +
      (S.A && S.B ? '两个文件都好了，看下面的列表 →'
                  : '单包模式：已列出全部图片，可直接搜索/筛选；再选第二个文件就能对比差异。'));
  } catch (e){
    const msg = (e && e.message) ? e.message : String(e);
    setStatus(which, '<span style="color:#dc2626">✗ ' + msg + '</span>');
    pushLog(which, '失败：' + msg);
    alertMsg('err', '【' + which + '】解析失败：' + msg + '　（可换个文件再试；若反复失败，把这句话发我）');
    S[which] = null;
    updateKsel(which);
  }
  render();
}

/* ===================== ★★ 槽内多 kzb 选择（2026-10-13） =====================
   一个 app.sv 里往往不止一个 kzb：主资源包 bic_byd_stha.kzb + custom-theme/template.kzb
   + 3dscreen.kzb（其他作者的包就是这样）。以前只认主包、别的只能提示；

async function switchKzb(which, i){
  const s = S[which];
  if (!s || !s.kzbs) return;

  const z = s.kzbs[i];
  /* 清掉「会因换包而失效」的替换指令：非本地图的替换（源取自另一侧）一律清；

  let cleared = 0;
  for (const [key, p] of [...PATCH]){
    const tgt = (p.dir === 'toA') ? 'A' : 'B';
    if (tgt === which || !p.custom){ PATCH.delete(key); cleared++; }
  }
  let dcleared = 0;
  try { if (typeof DPATCH !== 'undefined' && DPATCH[which]){ dcleared = DPATCH[which].size; DPATCH[which].clear(); } } catch (e){}
  try { SELECT.clear(); } catch (e){}
  alertMsg('info', '【' + which + '】切换到 ' + z.short + '…（大包首次解析要几秒）');
  try {
    if (!z.parsed) z.parsed = await parseKzb(z.data, () => {});
    Object.assign(s, z.parsed, { sv: z.sv || null, ki: i, kzbName: z.name, kzbShort: z.short });
  } catch (e){
    alertMsg('err', '【' + which + '】切换失败：' + ((e && e.message) || e));
    updateKsel(which);
    return;
  }
  setStatus(which, '✓ ' + s.items.length + ' 张 PNG　<span style="color:#b45309">（共 ' + s.kzbs.length + ' 个 kzb，可切换）</span>');
  pushLog(which, '切换到 ' + z.short + '：' + s.items.length + ' 张 PNG' +
    (cleared ? '，清除替换 ' + cleared + ' 项' : '') + (dcleared ? '，清除声明 ' + dcleared + ' 处' : ''));
  updateKsel(which);
  syncPatchUI();
  render();
  alertMsg('ok', '【' + which + '】已切到 ' + z.short + '：' + s.items.length + ' 张 PNG' +
    (cleared ? '。该槽相关替换 ' + cleared + ' 项已清除（图名含义随包变了）' : '') +
    (dcleared ? '；声明改动 ' + dcleared + ' 处已清除（字节偏移随包变了）' : '') + '。');
}

/* ===================== 对比 ===================== */
function uniqCats(items){ return [...new Set(items.map(i => i.cat))].sort(); }
function buildRows(){
  if (!S.A && !S.B) return null;
  if (!S.A || !S.B){                       // 单包模式：只列出这一个包里的全部图片
    const which = S.A ? 'A' : 'B';
    const one = S[which];
    return one.items.map(i => ({
      key: i.key, base: i.base, cat: i.cat,
      a: which === 'A' ? i : null,
      b: which === 'B' ? i : null,
      st: 'solo'
    }));
  }
  const A = new Map(S.A.items.map(i => [i.key, i]));
  const B = new Map(S.B.items.map(i => [i.key, i]));
  const keys = [...new Set([...A.keys(), ...B.keys()])].sort();
  const rows = [];
  for (const k of keys){
    const a = A.get(k), b = B.get(k);
    let st;
    if (a && !b) st = 'onlyA';
    else if (!a && b) st = 'onlyB';
    else if (a.size !== b.size) st = 'diff';
    else {
      let same = true;
      const ba = S.A.bytes, bb = S.B.bytes;
      for (let i = 0; i < a.size; i++) if (ba[a.pngOff + i] !== bb[b.pngOff + i]) { same = false; break; }
      st = same ? 'same' : 'diff';
    }
    rows.push({ key: k, base: (a || b).base, cat: (a || b).cat, a, b, st });
  }
  return rows;
}
const ST_TXT = { same: '一致', diff: '内容不同', onlyA: '仅 A 有', onlyB: '仅 B 有', solo: '已载入' };
const ST_CLS = { same: 'b-same', diff: 'b-diff', onlyA: 'b-onlyA', onlyB: 'b-onlyB', solo: 'b-solo' };

/* 模糊匹配打分：直接子串(3) > 忽略分隔符后子串(2) > 字符子序列(1) > 不匹配(0) */
const NORM_RE = /[\s_\-\.\(\)（）\[\]【】,，、]+/g;
function normName(x){ return String(x).toLowerCase().replace(NORM_RE, ''); }
function fuzzyScore(text, q){
  if (!q) return 1;
  const t = String(text).toLowerCase(), s = q.toLowerCase().trim();
  if (!s) return 1;
  if (t.includes(s)) return 3;
  const tn = normName(t), sn = normName(s);
  if (sn && tn.includes(sn)) return 2;
  let i = 0;
  for (let k = 0; k < tn.length && i < sn.length; k++) if (tn[k] === sn[i]) i++;
  return i >= sn.length ? 1 : 0;
}

/* ===================== 预览底色 / 引擎预乘合成 ===================== */
let BG = 't';                                    // t=棋盘(透明) w=白 d=深
let PRE = false;                                 // 是否按引擎的预乘 alpha 混合合成
const BG_RGB = { t: null, w: [255, 255, 255], d: [20, 20, 20] };
let PRE_JOBS = [], PRE_SEQ = 0, VIEWER_R = null;

function setBg(v){ BG = v; applyBg(); draw(); }
function applyBg(){
  try{
    document.body.classList.toggle('bgw', BG === 'w');
    document.body.classList.toggle('bgd', BG === 'd');
    document.querySelectorAll('.seg').forEach(b =>
      b.classList.toggle('on', b.getAttribute('data-bg') === BG));
  } catch (e){ /* 测试环境可能没有 body/querySelectorAll */ }
}
function preOn(){ return PRE && !!BG_RGB[BG] && typeof createImageBitmap === 'function'; }

function pngBlob(i, bytes){
  return new Blob([bytes.subarray(i.pngOff, i.pngOff + i.size)], { type: 'image/png' });
}

/* 按引擎的「预乘 alpha」混合合成到当前底色： out = rgb + 底 × (1 - a/255)
   注意：浏览器 <img> 走的是「直通」混合，跟引擎不一致 ——
   想看实机（尤其夜间深色底）真实效果，必须自己合成。 */
async function premulCanvas(i, bytes, tw, th, override){
  const bg = BG_RGB[BG];
  if (!bg || typeof createImageBitmap !== 'function') return null;
  /* override = 完整的 PNG 字节（用于「替换后预览」）；不给就走包内字节 */
  const bmp = await createImageBitmap(override ? new Blob([override], { type: 'image/png' }) : pngBlob(i, bytes));
  const sc = Math.min(tw / bmp.width, th / bmp.height, 1);
  const w = Math.max(1, Math.round(bmp.width * sc));
  const h = Math.max(1, Math.round(bmp.height * sc));
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(bmp, 0, 0, w, h);
  if (bmp.close) bmp.close();
  const id = ctx.getImageData(0, 0, w, h);
  const d = id.data;
  for (let k = 0; k < d.length; k += 4){
    const f = (255 - d[k + 3]) / 255;
    d[k]     = Math.min(255, d[k]     + bg[0] * f + .5);
    d[k + 1] = Math.min(255, d[k + 1] + bg[1] * f + .5);
    d[k + 2] = Math.min(255, d[k + 2] + bg[2] * f + .5);
    d[k + 3] = 255;
  }
  ctx.putImageData(id, 0, 0);
  return c;
}

async function runPremul(){
  const seq = ++PRE_SEQ;
  const jobs = PRE_JOBS;
  for (let k = 0; k < jobs.length; k++){
    if (seq !== PRE_SEQ) return;                 // 已重绘，作废
    if (k % 8 === 7) await new Promise(r => setTimeout(r, 0));
    const box = jobs[k][0], item = jobs[k][1], bytes = jobs[k][2], ov = jobs[k][3];
    if (!box || !box.isConnected || !box.querySelector) continue;
    try{
      const c = await premulCanvas(item, bytes, 190, 116, ov);
      if (c && box.isConnected && seq === PRE_SEQ){
        const im = box.querySelector('img');
        if (im && im.parentNode === box) box.replaceChild(c, im);
      }
    } catch (e){ /* 单张失败保持原样 */ }
  }
}

async function premulViewer(){
  const seq = ++PRE_SEQ;
  const r = VIEWER_R;
  if (!r) return;
  const bs = document.querySelectorAll('#dlgBody .pane .box');
  for (let k = 0; k < bs.length; k++){
    const box = bs[k];
    const side = box.getAttribute ? box.getAttribute('data-side') : null;
    const item = side === 'a' ? r.a : side === 'b' ? r.b : null;
    const bytes = side === 'a' ? (S.A && S.A.bytes) : (S.B && S.B.bytes);
    if (!item || !bytes || !box.querySelector) continue;
    try{
      const c = await premulCanvas(item, bytes, 480, 290, viewBytes(side, r.key, item, bytes).bytes);
      if (c && seq === PRE_SEQ && box.isConnected){
        const im = box.querySelector('img');
        if (im && im.parentNode === box) box.replaceChild(c, im);
      }
    } catch (e){}
  }
}

/* 声明尺寸辅助判断 */
const declBad = i => !!(i && i.decl && (Math.abs(i.decl[0] - i.h) > 0.01 || Math.abs(i.decl[1] - i.w) > 0.01));
const declNone = i => !!(i && !i.decl);

      : st === 'declnone' ? (declNone(r.a) || declNone(r.b))
      : r.st === st)));
  if (q){
    rows = rows.map(r => ({ r, sc: Math.max(fuzzyScore(r.base, q), fuzzyScore(r.key, q) - 1) }))
               .filter(x => x.sc > 0)
               .sort((p, n2) => (n2.sc - p.sc) || p.r.base.localeCompare(n2.r.base))

      '<div class="patch">' +
        '<button class="pA" data-d="toA"' + (r.a ? '' : ' disabled="disabled"') +
          ' title="用 B 侧的同名图（或你自己选的本地图）替换进 A 包的这张">◀ 替换进 A</button>' +
        '<button class="pB" data-d="toB"' + (r.b ? '' : ' disabled="disabled"') +

  grid.appendChild(frag);

function esc(s){ return String(s).replace(/[&<>"]/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' })[m]); }

/* ===================== 替换指令 PATCH =====================
   dir: 'toA' → 用「B 侧那张」（或本地图）替换进 **A 包**   （卡片上 ◀）
        'toB' → 用「A 侧那张」（或本地图）替换进 **B 包**   （卡片上 ▶）
   custom: { name, bytes } —— 本地图片；有它时「源」就是本地图，dir 只决定替换进哪个包
========================================================== */
const PATCH = new Map();
let BUILD_PLAN = null;                 // 待出包的清单（askBuildTarget 填，doBuild 用）

/* ★★ 预览取图（2026-10-11 修）：这一侧如果是「替换目标」，预览就该显示
   替换后的图（本地图 / 对侧同名图），而不是包里的原图。
   优先级：本地图 > 对侧同名图 > 原图（拿不到替换源时退回原图）。
   返回 { bytes(完整 PNG), replaced, why }。 */
function viewBytes(side, key, item, pkgBytes){
  const orig = () => pkgBytes.subarray(item.pngOff, item.pngOff + item.size);
  const p = PATCH.get(key);
  if (!p || !item) return { bytes: orig(), replaced: false, why: 'orig' };
  const isTarget = (p.dir === 'toA' && side === 'a') || (p.dir === 'toB' && side === 'b');
  if (!isTarget) return { bytes: orig(), replaced: false, why: 'orig' };
  if (p.custom && p.custom.bytes) return { bytes: p.custom.bytes, replaced: true, why: 'local' };
  const os = S[p.dir === 'toA' ? 'B' : 'A'];
  const oi = (os && os.bytes) ? (os.items || []).find(x => x.key === key) : null;
  if (oi) return { bytes: os.bytes.subarray(oi.pngOff, oi.pngOff + oi.size), replaced: true, why: 'other' };
  return { bytes: orig(), replaced: false, why: 'missing' };
}
/* 预览 URL：缓存键带「内容签名」—— 替换状态一变就自动重建（旧版固定缓存 ⇒ 换了本地图也不更新） */
function viewUrl(side, key, item, pkgBytes){
  const v = viewBytes(side, key, item, pkgBytes);
  const p = PATCH.get(key);
  const sig = side + '|' + v.bytes.length + '|' + (v.replaced ? (v.why + (p && p.custom ? p.custom.name : '')) : 'orig');
  if (item._urlSig !== sig){
    if (item._url){ try { URL.revokeObjectURL(item._url); } catch (e){} }
    item._url = URL.createObjectURL(new Blob([v.bytes], { type: 'image/png' }));
    item._urlSig = sig;
  }
  return { url: item._url, replaced: v.replaced };
}
/* ★ 字体替换指令：slot('A'|'B') → Map<tar 条目起始 pos, {name, short, bytes, srcName, srcSize, kind}> */
const FPATCH = { A: new Map(), B: new Map() };
function fontCount(slot){ const m = FPATCH[slot]; return m ? m.size : 0; }
function fontPatchTotal(){ try { return fontCount('A') + fontCount('B'); } catch (e){ return 0; } }

function patchToggle(key, dir){
  const cur = PATCH.get(key);
  if (cur && cur.dir === dir && !cur.custom) PATCH.delete(key);      // 再点一次 = 取消
  else PATCH.set(key, { dir, custom: cur ? cur.custom : null });
  syncPatchUI();
}
function patchSetCustom(key, custom){          // 从大图里「换成本地图」时调用
  const cur = PATCH.get(key);
  const dir = cur ? cur.dir : (S.A ? 'toA' : 'toB');
  PATCH.set(key, { dir, custom });
  syncPatchUI();
}
function patchCounts(){
  let toA = 0, toB = 0, cu = 0;
  for (const p of PATCH.values()){ if (p.dir === 'toA') toA++; else toB++; if (p.custom) cu++; }
  return { toA, toB, cu, total: PATCH.size };
}
/* 更新单张卡片的按钮状态（自定义图时按钮带 📁） */
function refreshCardPatch(key){

    if (!b) return;

      b.textContent = (side === 'toA') ? ('◀ ' + tag + '替换进 A') : (tag + '替换进 B ▶');
    } catch (e){}
  };
  set(c.pA, 'toA');
  set(c.pB, 'toB');
}

function batchPatch(dir){
  const keys = [...SELECT];
  if (!keys.length){ alertMsg('warn', '先在卡片左上角勾选要批量设置的图片（勾选框），再点批量按钮。'); return; }
  const amap = new Map((S.A ? S.A.items : []).map(i => [i.key, i]));
  const bmap = new Map((S.B ? S.B.items : []).map(i => [i.key, i]));
  let n = 0, skip = 0;
  for (const k of keys){
    const cur = PATCH.get(k);
    if (dir === 'toA' && !bmap.has(k)){ skip++; continue; }         // 源侧没有
    if (dir === 'toB' && !amap.has(k)){ skip++; continue; }
    PATCH.set(k, { dir, custom: cur ? cur.custom : null });
    n++;
  }
  syncPatchUI();
  alertMsg(n ? 'ok' : 'warn', '已把 ' + n + ' 张设为「' + (dir === 'toA' ? '用 B 替换进 A' : '用 A 替换进 B') +
    '」' + (skip ? '；' + skip + ' 张因源侧没有同名图被跳过' : '') + '。');
}

/* ===================== 📐 尺寸声明（kzb 内的渲染尺寸） =====================
   声明结构：[u32 126][f32 高] …（中间可插其它 tag，如 [127][1.0]）… [u32 64][f32 宽]
     —— 写在节点/纹理名【之前】，宽度字段偏移 = 64 标签 + 4。
   声明 = 引擎渲染目标尺寸 ⇒ 按它拉伸、不保持宽高比。贴图比声明宽就会被压扁
     （我们的数字贴图 93 宽、原厂声明 73 宽，就是这个坑）。
   ★ 只改「高/宽」那 4 字节 f32 ⇒ 等长覆盖，整体长度与所有偏移都不变。
   ★ 改动在【重建之前】写进底包副本；重建时未替换条目是「整段原样搬运」⇒ 必然带上。
   ★ 批量：按「当前尺寸」分组，一次改一整组（数字贴图那种同尺寸的最省事）。
========================================================== */
const DPATCH = { A: new Map(), B: new Map() };   // slot → Map<声明起始偏移 p, {hOff,wOff,h,w}>
let DECL_SLOT = 'A';
let DECL_ROWS = [];

/* 按「应用后的当前尺寸」分组（叠加 DPATCH 的待改动值） */
function declRows(slot){
  const base = S[slot];
  if (!base || !base.declsAll) return [];
  const m = DPATCH[slot], g = new Map();
  for (const d of base.declsAll){
    const ov = m.get(d.p);
    const h = (ov && ov.h != null) ? ov.h : d.h;
    const w = (ov && ov.w != null) ? ov.w : d.w;
    const key = h + '|' + w;
    let e = g.get(key);
    if (!e) g.set(key, e = { h, w, n: 0, names: [], dirty: false });
    e.n++;
    if (ov) e.dirty = true;
    if (d.name) e.names.push(d.name.replace(/^kzb:\/\/[^/]*\//, ''));
  }
  return [...g.values()].sort((a, b) => b.n - a.n || a.h - b.h);
}
/* 把「当前尺寸 = h×w」这一整组改成 nh×nw（null = 该项不改） */
function declApplyGroup(slot, h, w, nh, nw){
  const base = S[slot];
  if (!base || !base.declsAll) return 0;
  const m = DPATCH[slot];
  let n = 0;
  for (const d of base.declsAll){
    const ov = m.get(d.p);
    const ch = (ov && ov.h != null) ? ov.h : d.h;
    const cw = (ov && ov.w != null) ? ov.w : d.w;
    if (Math.abs(ch - h) > 1e-6 || Math.abs(cw - w) > 1e-6) continue;   // 不属这一组
    const cur = ov || { hOff: d.hOff, wOff: d.wOff, h: null, w: null };
    if (nh != null) cur.h = nh;
    if (nw != null) cur.w = nw;
    if (cur.h == null && cur.w == null) m.delete(d.p); else m.set(d.p, cur);
    n++;
  }
  return n;
}
/* 把 DPATCH 的改动写进底包字节的【副本】（等长覆盖），返回新数组 */
function declApplyBytes(u8, dmap){
  const out = u8.slice();
  const dv = new DataView(out.buffer, out.byteOffset, out.byteLength);
  for (const ov of dmap.values()){
    if (ov.h != null) dv.setFloat32(ov.hOff, ov.h, true);
    if (ov.w != null) dv.setFloat32(ov.wOff, ov.w, true);
  }
  return out;
}
function declCount(slot){ try { return DPATCH[slot].size; } catch (e){ return 0; } }
function declTotal(){ return declCount('A') + declCount('B'); }

let PREV_FONT_KEY = '';                  // 预览区当前字体（'' = 系统默认）

const FONT_SAMPLES = [

function openFontDlg(){

/* 在另一槽里找同名字体条目（两个包的 tar 里字体路径一致，按全名精确匹配） */
function fontInOther(slot, name){
  const other = (slot === 'A') ? 'B' : 'A';
  const s = S[other];
  if (!s || !s.sv || !s.sv.fonts) return null;
  return s.sv.fonts.find(f => f.name === name) || null;
}
/* 从某槽的 tar 里按条目取字体字节（返回视图；要留存请自行拷贝） */
function fontBytesOf(slot, ent){
  const s = S[slot];
  if (!s || !s.sv || !ent) return null;
  return s.sv.tar.subarray(ent.pos + 512, ent.pos + 512 + ent.size);
}
/* ★ 双向替换之一：用「另一槽」的同名字体换进本槽（同一来源再点 = 取消） */
function fontPatchToggle(slot, pos, from){
  const s = S[slot];
  if (!s || !s.sv || !s.sv.fonts){ alertMsg('err', slot + ' 槽没有可用的 app.sv 外壳'); return; }
  const ent = s.sv.fonts.find(f => f.pos === pos);
  if (!ent){ alertMsg('err', '找不到该字体条目（包可能已换，请重新加载）'); return; }
  const cur = FPATCH[slot].get(pos);
  if (cur && cur.from === from){ clearFont(slot, pos); return; }        // 同方向再点 = 取消
  const oe = fontInOther(slot, ent.name);
  if (!oe){ alertMsg('warn', from + ' 槽里没有同名字体【' + ent.short + '】，没法这样换。'); return; }
  const view = fontBytesOf(from, oe);
  if (!view){ alertMsg('err', '读取 ' + from + ' 槽的字体失败'); return; }
  const bytes = new Uint8Array(view.length); bytes.set(view);           // 拷贝（tar 之后可能被换掉）
  const kind = fontKind(bytes) || '未知类型';
  FPATCH[slot].set(pos, { name: ent.name, short: ent.short, bytes, kind,
                          srcName: from + ' 包的 ' + ent.short, srcSize: bytes.length, from });
  ensurePreviewFont(slot, pos, bytes).then(() => {
    PREV_FONT_KEY = slot + '/' + pos;
    renderFontDlg();
  }).catch(() => renderFontDlg());
  syncPatchUI();
  alertMsg('ok', '已用【' + from + ' 包】的 ' + ent.short + '（' + fmt(bytes.length) + ' B）替换进 ' +
    slot + ' 包的同一字体。包内文件名保持 ' + ent.short + ' 不变。');
}
/* ★ 提取字体到本地（有替换时提取的是「替换后」那一份） */
function extractFont(slot, pos){
  const s = S[slot];
  if (!s || !s.sv || !s.sv.fonts){ alertMsg('warn', slot + ' 槽没有可提取的字体'); return; }
  const ent = s.sv.fonts.find(f => f.pos === pos);
  if (!ent) return;
  const cur = FPATCH[slot].get(pos);
  let bytes;
  if (cur) bytes = cur.bytes;
  else { const v = fontBytesOf(slot, ent); bytes = new Uint8Array(v.length); bytes.set(v); }
  if (!bytes || !bytes.length){ alertMsg('err', '字体内容为空，提取失败'); return; }
  const url = URL.createObjectURL(new Blob([bytes], { type: 'font/ttf' }));
  const a = document.createElement('a');
  a.href = url; a.download = ent.short;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 20000);
  alertMsg('ok', '已开始下载 ' + slot + ' 包的【' + ent.short + '】（' + fmt(bytes.length) + ' B' +
    (cur ? '，替换后的版本' : '，原版') + '）');
}
function fontRows(slot){
  const s = S[slot];
  if (!s) return '<div class="note">' + slot + ' 槽还没加载文件。</div>';
  if (!s.sv) return '<div class="note">' + slot + ' 槽（' + esc(s.file) +
    '）加载的是纯 .kzb，没有 app.sv 外壳 ⇒ 不能换字体（请改选 app.sv 或整包 zip）。</div>';
  const fonts = s.sv.fonts || [];
  if (!fonts.length) return '<div class="note">这个 app.sv 的 tar 里没找到字体条目（.ttf / .otf / .ttc）。</div>';
  const other = (slot === 'A') ? 'B' : 'A';
  const otherOk = !!(S[other] && S[other].sv);          // 另一槽也加载了 app.sv ⇒ 才能互替
  const rows = fonts.map(f => {
    const cur = FPATCH[slot].get(f.pos);
    const isA = (slot === 'A');
    const srcSlot = isA ? 'B' : 'A';                       // 这一行的「另一侧」= 替换源

    const st = cur

        '<br><span style="color:#6c7686">来源：' + esc(cur.srcName) + '（' + fmt(cur.srcSize) + ' B · ' + esc(cur.kind) + '）</span>'
      : '<span style="color:#6c7686">原版</span>' +
        (oe ? '<br><span style="color:#98a2b3">' + srcSlot + ' 槽有同名字体，可互替</span>' : '');
    const usable = otherOk && !!oe;
    const dirBtn = '<button class="fbtn' + (usable && cur && cur.from === srcSlot ? ' on' : '') + '"' +
      (usable ? ' onclick="fontPatchToggle(\'' + slot + '\',' + f.pos + ',\'' + srcSlot + '\')"' : ' disabled') +
      ' title="' + (usable
        ? '用 ' + srcSlot + ' 包里的同名字体，替换进 ' + slot + ' 包的这个字体（再点一次取消）'
        : (otherOk ? srcSlot + ' 槽里没有同名字体' : '另一槽还没加载 app.sv')) + '">' +
      (isA ? '◀ 用 B 换进 A' : '用 A 换进 B ▶') + '</button>';
    const btns = dirBtn +
      '<button class="fbtn" onclick="pickTtf(\'' + slot + '\',' + f.pos + ')">📁 本地字体…</button>' +
      '<button class="fbtn" onclick="extractFont(\'' + slot + '\',' + f.pos + ')">💾 提取</button>' +
      (cur ? '<button class="fbtn" onclick="clearFont(\'' + slot + '\',' + f.pos + ')">↺ 还原</button>' : '');
    return '<tr>' +
      '<td style="padding:6px 10px 6px 0;font:12px Consolas,monospace;word-break:break-all">' + esc(f.short) +

/* 把选到的字体文件装进 FPATCH（含校验 + 预览用 FontFace 加载） */
async function setFontFile(slot, pos, file){
  const s = S[slot];
  if (!s || !s.sv || !s.sv.fonts){ alertMsg('err', slot + ' 槽没有 app.sv 外壳，换不了字体'); return; }
  const ent = s.sv.fonts.find(f => f.pos === pos);

  try {

    if (!kind) throw new Error('这不像是字体文件（已认 TTF / OTF / TTC / WOFF / WOFF2）—— 确认一下选的是字体文件');
    if (bytes.length < 1024) throw new Error('文件只有 ' + fmt(bytes.length) + ' B，不像有效字体');
    FPATCH[slot].set(pos, { name: ent.name, short: ent.short, bytes, kind,
                            srcName: file.name, srcSize: bytes.length, from: 'local' });
    await ensurePreviewFont(slot, pos, bytes);
    PREV_FONT_KEY = slot + '/' + pos;                 // 预览自动切到刚选的字体
    renderFontDlg();
    syncPatchUI();
    alertMsg('ok', '✓ 已把【' + ent.short + '】的替换源设为：' + file.name +
      '（' + fmt(bytes.length) + ' B · ' + kind + '）。包内文件名保持 ' + ent.short + ' 不变。');
  } catch (e){
    alertMsg('err', '字体不可用：' + ((e && e.message) || e));
  }
}
async function ensurePreviewFont(slot, pos, bytes){
  const key = slot + '/' + pos;
  if (FONT_PREVIEW.has(key)) return FONT_PREVIEW.get(key);
  const fam = 'kbzfont_' + Math.random().toString(36).slice(2, 9);
  const ab = bytes.buffer.slice(bytes.byteOffset, bytes.byteOffset + bytes.byteLength);
  const face = new FontFace(fam, ab);
  await face.load();
  document.fonts.add(face);
  FONT_PREVIEW.set(key, fam);
  return fam;
}

/* ---- 生成文件清单（纯函数，便于回归测试）---- */
const saneSeg = s => String(s).replace(/[\\:*?"<>|]/g, '_').replace(/^\.+$/, '_');
function buildExportList(rows, mode, keepStruct){
  const out = [];
  const used = { A: new Set(), B: new Set() };
  const rel = (r, item, side) => {
    const dirs = [];
    if (mode === 'AB') dirs.push(side);
    if (keepStruct && r.cat && r.cat !== '(根)') dirs.push(r.cat.split('/').map(saneSeg).join('/'));
    const name = saneSeg(item.base) || 'unnamed.png';
    let path = dirs.concat(name).join('/');
    const set = used[side];
    if (set.has(path.toLowerCase())){                 // 不保结构时可能重名，自动加序号
      const stem = name.replace(/\.png$/i, '');
      let n = 2, cand;
      do { cand = dirs.concat(stem + '_' + (n++) + '.png').join('/'); } while (set.has(cand.toLowerCase()));
      path = cand;
    }
    set.add(path.toLowerCase());
    return path;
  };
  for (const r of rows){
    if ((mode === 'A' || mode === 'AB') && r.a) out.push({ path: rel(r, r.a, 'A'), item: r.a, bytes: S.A.bytes, side: 'A' });
    if ((mode === 'B' || mode === 'AB') && r.b) out.push({ path: rel(r, r.b, 'B'), item: r.b, bytes: S.B.bytes, side: 'B' });
  }
  return out;
}

/* ---- 执行提取 ---- */
async function doExport(mode){
  const rows = PENDING;
  if (!rows || !rows.length){ closePick(); return; }
  const ks = document.getElementById('keepStruct');
  const keep = ks ? !!ks.checked : true;
  const files = buildExportList(rows, mode, keep);
  closePick();
  if (!files.length){ alertMsg('warn', '这一边没有可提取的图片。'); return; }
  const sub = mode === 'AB' ? '（A/ 与 B/ 两个子文件夹）' : '';
  if (window.showDirectoryPicker){
    let dir;
    try { dir = await window.showDirectoryPicker({ mode: 'readwrite', id: 'kzbpng' }); }
    catch (e){
      if (e && e.name === 'AbortError') return;                 // 用户自己取消
      const zip = zipStore(files);                              // 环境受限（预览面板/非安全上下文）→ 自动降级
      downloadBlob(new Blob([zip], { type: 'application/zip' }), 'kzb_png_extract.zip');
      alertMsg('warn', '没法直接写文件夹（' + ((e && e.message) || e) + '），已改为打包 zip 下载（' + files.length + ' 张' + sub + '）。' +
        '把 kzb_png_compare.html 双击用 Chrome / Edge 打开，就能直接选文件夹。');
      return;
    }
    try {
      let n = 0;
      const dirCache = new Map();                       // 目录句柄缓存，避免每张图都重建目录
      const getDir = async path => {
        if (!path) return dir;
        if (dirCache.has(path)) return dirCache.get(path);
        const i = path.lastIndexOf('/');
        const parent = await getDir(i < 0 ? '' : path.slice(0, i));
        const h = await parent.getDirectoryHandle(path.slice(i + 1), { create: true });
        dirCache.set(path, h);
        return h;
      };
      for (const f of files){
        const segs = f.path.split('/');
        const fname = segs.pop();
        const d = await getDir(segs.join('/'));
        const fh = await d.getFileHandle(fname, { create: true });
        const w = await fh.createWritable();
        await w.write(new Blob([itemBytes(f)]));
        await w.close();
        n++;
        if (n % 20 === 0 || n === files.length) alertMsg('info', '正在写入 ' + n + ' / ' + files.length + ' …');
      }
      alertMsg('ok', '已提取 ' + files.length + ' 张到「' + dir.name + '」' + sub + '。');
    } catch (e){
      alertMsg('err', '写入失败：' + ((e && e.message) || e) + '　—— 若是权限问题，重新点一次并在弹窗里允许写入。');
    }
  } else {
    const zip = zipStore(files);
    downloadBlob(new Blob([zip], { type: 'application/zip' }), 'kzb_png_extract.zip');
    alertMsg('warn', '当前浏览器不支持直接写文件夹，已打包成 zip 下载（共 ' + files.length + ' 张' + sub + '）。建议用 Chrome / Edge 打开本页，就能直接选文件夹。');
  }
}

/* ---- 降级方案：打包 ZIP（store 不压缩，PNG 本身已压）---- */
function zipStore(files){
  const enc = new TextEncoder();
  const parts = [], cd = [];
  let off = 0, cdSize = 0;
  for (const f of files){
    const nm = enc.encode(f.path), data = itemBytes(f), crc = crc32(data);
    const lh = new Uint8Array(30 + nm.length), lv = new DataView(lh.buffer);
    lv.setUint32(0, 0x04034b50, true); lv.setUint16(4, 20, true); lv.setUint16(6, 0x0800, true);
    lv.setUint16(8, 0, true); lv.setUint16(10, 0, true); lv.setUint16(12, 0x2821, true);
    lv.setUint32(14, crc, true); lv.setUint32(18, data.length, true); lv.setUint32(22, data.length, true);
    lv.setUint16(26, nm.length, true);
    lh.set(nm, 30);
    parts.push(lh, data);
    const ch = new Uint8Array(46 + nm.length), cv = new DataView(ch.buffer);
    cv.setUint32(0, 0x02014b50, true); cv.setUint16(4, 20, true); cv.setUint16(6, 20, true);
    cv.setUint16(8, 0x0800, true); cv.setUint16(10, 0, true); cv.setUint16(12, 0, true); cv.setUint16(14, 0x2821, true);
    cv.setUint32(16, crc, true); cv.setUint32(20, data.length, true); cv.setUint32(24, data.length, true);
    cv.setUint16(28, nm.length, true); cv.setUint32(42, off, true);
    ch.set(nm, 46);
    cd.push(ch); cdSize += ch.length;
    off += lh.length + data.length;
  }
  const eo = new Uint8Array(22), ev = new DataView(eo.buffer);
  ev.setUint32(0, 0x06054b50, true);
  ev.setUint16(8, files.length, true); ev.setUint16(10, files.length, true);
  ev.setUint32(12, cdSize, true); ev.setUint32(16, off, true);
  const out = new Uint8Array(off + cdSize + 22);
  let p = 0;
  for (const x of parts) { out.set(x, p); p += x.length; }
  for (const x of cd) { out.set(x, p); p += x.length; }
  out.set(eo, p);
  return out;
}
function downloadBlob(blob, name){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
}

/* ===================== 导出 / 复制 ===================== */
function exportCsv(){
  const head = ['分类', '文件名', '状态', 'A尺寸', 'A字节', 'B尺寸', 'B字节', '完整路径'];
  const lines = [head.join(',')];
  for (const r of ROWS){
    lines.push([r.cat, r.base, ST_TXT[r.st],
      r.a ? r.a.w + 'x' + r.a.h : '', r.a ? r.a.size : '',
      r.b ? r.b.w + 'x' + r.b.h : '', r.b ? r.b.size : '',
      r.key].map(v => '"' + String(v).replace(/"/g, '""') + '"').join(','));
  }
  const blob = new Blob(['\ufeff' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'kzb_png_diff.csv';
  a.click();
}
function copyKeys(){
  const t = ROWS.filter(r => r.st !== 'same')
    .map(r => ST_TXT[r.st] + '\t' + r.key + '\t' +
      (r.a ? r.a.w + 'x' + r.a.h + ' ' + r.a.size + 'B' : '-') + '\t' +
      (r.b ? r.b.w + 'x' + r.b.h + ' ' + r.b.size + 'B' : '-')).join('\n');
  navigator.clipboard.writeText(t).then(
    () => alert('已复制 ' + ROWS.filter(r => r.st !== 'same').length + ' 条差异到剪贴板'),
    () => alert('复制失败，可改用「导出 CSV」'));
}

/* ===================== 事件绑定 ===================== */
['A', 'B'].forEach(w => {
  const slot = document.getElementById('slot' + w);
  const inp = document.getElementById('file' + w);
  slot.onclick = () => inp.click();
  inp.onchange = () => { if (inp.files[0]) load(w, inp.files[0]); };
  slot.ondragover = e => { e.preventDefault(); slot.style.borderColor = '#2563eb'; };
  slot.ondragleave = () => { slot.style.borderColor = ''; };
  slot.ondrop = e => {
    e.preventDefault(); slot.style.borderColor = '';
    const f = e.dataTransfer.files[0];
    if (f) load(w, f);
  };
});
/* 大图里「换成本地图」选文件 */
(function(){
  const inp = document.getElementById('filePng');
  if (!inp) return;
  inp.onchange = async () => {
    const f = inp.files && inp.files[0];
    const ctx = PICK_FOR;
    PICK_FOR = null;
    if (!f || !ctx) return;
    try {
      const bytes = new Uint8Array(await f.arrayBuffer());
      if (!(bytes[0] === 0x89 && bytes[1] === 0x50 && bytes[2] === 0x4E && bytes[3] === 0x47))
        throw new Error('这不是 PNG 文件（缺少 PNG 签名）');
      if (bytes.length < 67) throw new Error('文件太小，不像是完整 PNG');
      PATCH.set(ctx.key, { dir: ctx.side === 'A' ? 'toA' : 'toB', custom: { name: f.name, bytes } });
      syncPatchUI();
      if (VIEWER_R && VIEWER_R.key === ctx.key) openViewer(VIEWER_R);
      alertMsg('ok', '已选用本地图「' + f.name + '」（' + fmt(bytes.length) + ' B）→ 替换进 ' + ctx.side + ' 包');
    } catch (e){
      alertMsg('err', '本地图读取失败：' + ((e && e.message) || e));
    }
  };
})();
/* 🔤 字体面板：选本地 TTF */
(function(){
  const inp = document.getElementById('fileTtf');
  if (!inp) return;
  inp.onchange = async () => {
    const f = inp.files && inp.files[0];
    const ctx = PICK_FONT;
    PICK_FONT = null;
    if (!f || !ctx) return;
    await setFontFile(ctx.slot, ctx.pos, f);
  };
})();
